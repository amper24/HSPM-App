version: '3.8'

services:
  db:
    image: mysql:5.7.21
    container_name: vshpm-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-vshpm_edu}
      MYSQL_USER: ${DB_USER:-vshpm}
      MYSQL_PASSWORD: ${DB_PASS:-vshpm_secret}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --character-set-server=utf8 --collation-server=utf8_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vshpm-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vshpm_edu}
      DB_USER: ${DB_USER:-vshpm}
      DB_PASS: ${DB_PASS:-vshpm_secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/uploads
      - exports:/var/www/html/exports
      - backups:/var/www/html/backups

volumes:
  mysql_data:
  uploads:
  exports:
  backups:
